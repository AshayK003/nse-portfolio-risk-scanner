[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-risk-scanner"
version = "0.20.4"
description = "Analyze your NSE portfolio for risk metrics"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35,<2",
    "plotly>=5.20,<7",
    "yfinance>=0.2.40,<1",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "loguru>=0.7.2,<1",
    "diskcache>=5.6.0,<6",
    "pdf-studio-py @ git+https://github.com/AshayK003/pdf-studio.git@0ffdaff",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
    "reportlab>=4",
    "pillow>=12.3.0",
    "openpyxl>=3.1,<4",
    "feedparser>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
    "pre-commit>=4.0",
    "vcrpy>=8.0.0",
]
pdf = [
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]
nse = [
    "nselib>=2.5.0",
]
ml = [
    "hmmlearn>=0.3.0",
]
advanced = [
    "arch>=5.0",
    "riskfolio-lib>=2",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["engine*", "data*", "ui*", "storage*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["engine", "data", "ui", "storage"]

[tool.coverage.report]
# Gate: fail the run when total coverage drops below 70%.
fail_under = 70
show_missing = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
