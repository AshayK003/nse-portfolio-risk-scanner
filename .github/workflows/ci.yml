name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies (all extras + dev)
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check engine/ ui/ data/ storage/ tests/ app.py

      - name: Format Check (ruff)
        run: uv run ruff format --check engine/ ui/ data/ storage/ tests/ app.py

      - name: Test (pytest)
        env:
          PYTHONPATH: ""
        run: uv run pytest tests/ -v --tb=short -q --cov=engine --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml